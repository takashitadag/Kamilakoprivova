<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamila Kopřivová | Realitní makléřka</title>

<style>

:root{
--cream:#f5f1e8;
--cream-dark:#ebe2d3;

--white:#ffffff;

--gold:#b79b67;
--gold-light:#ceb58a;

--olive:#66755a;
--olive-dark:#4f5d45;
--olive-light:#8b9a7f;

--sand:#ddd0bc;

--dark:#2a2925;
--text:#4d4a45;
--muted:#746f67;

--border:#e6dccd;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:
linear-gradient(
180deg,
var(--cream),
#fffaf2
);

font-family:Arial,sans-serif;
color:var(--text);
line-height:1.7;
}

h1,h2,h3{
font-family:Georgia,serif;
font-weight:normal;
}

header{
position:sticky;
top:0;
z-index:1000;

background:
rgba(245,241,232,0.94);

backdrop-filter:blur(14px);

border-bottom:
1px solid var(--border);

display:flex;
justify-content:space-between;
align-items:center;

padding:22px 8%;
}

/* LOGO */

.logo{
font-size:24px;
font-family:Georgia,serif;
font-weight:bold;

color:white;
text-decoration:none;

padding:10px 18px;
border-radius:16px;

background:
linear-gradient(
135deg,
var(--olive),
var(--olive-dark)
);

box-shadow:
0 10px 25px rgba(79,93,69,0.28);

transition:0.3s;
}

.logo:hover{
transform:translateY(-2px);

box-shadow:
0 14px 30px rgba(79,93,69,0.35);
}

.logo span{
color:#f3e6c9;
}

/* NAV */

nav{
display:flex;
align-items:center;
gap:28px;
}

nav a{
text-decoration:none;
color:var(--dark);
font-size:15px;
transition:0.3s;
}

nav a:hover{
color:var(--olive);
}

/* HERO */

.hero{
min-height:90vh;

display:grid;
grid-template-columns:1.1fr 0.9fr;
gap:70px;

align-items:center;

padding:90px 8%;
}

.hero-label{
text-transform:uppercase;
letter-spacing:2px;
font-size:13px;
color:var(--olive);
margin-bottom:20px;
font-weight:bold;
}

.hero h1{
font-size:62px;
line-height:1.08;
color:var(--dark);

margin-bottom:28px;
max-width:720px;
}

.hero p{
font-size:18px;
color:var(--muted);

max-width:620px;
margin-bottom:36px;
}

.buttons{
display:flex;
gap:16px;
flex-wrap:wrap;
}

.btn{
display:inline-block;

padding:15px 30px;

border-radius:40px;

text-decoration:none;
font-weight:bold;

transition:0.3s;
}

.btn-primary{
background:
linear-gradient(
135deg,
var(--olive),
var(--olive-dark)
);

color:white;

box-shadow:
0 10px 25px rgba(102,117,90,0.25);
}

.btn-primary:hover{
transform:translateY(-2px);
}

.btn-secondary{
border:1px solid var(--gold);

color:var(--dark);

background:
rgba(255,255,255,0.45);
}

.btn-secondary:hover{
background:var(--gold-light);
color:white;
}

/* HERO IMAGE */

.hero-image{
background:
linear-gradient(
180deg,
#ffffff,
#f7f2ea
);

padding:18px;

border-radius:34px;

box-shadow:
0 28px 80px rgba(80,70,50,0.13);
}

.hero-image img{
width:100%;
height:540px;

object-fit:cover;

border-radius:25px;
}

/* STATS */

.stats{
padding:0 8% 90px;

display:grid;
grid-template-columns:repeat(3,1fr);

gap:24px;
}

.stat{
background:
linear-gradient(
180deg,
#ffffff,
#f7f2ea
);

padding:38px;

border-radius:30px;

text-align:center;

border:1px solid var(--border);

box-shadow:
0 18px 45px rgba(80,70,50,0.08);
}

.stat h2{
font-size:46px;
color:var(--olive);

margin-bottom:8px;
}

.stat p{
color:var(--muted);
}

/* GENERAL */

section{
padding:90px 8%;
}

.section-title{
font-size:46px;

text-align:center;

margin-bottom:18px;

color:var(--dark);
}

.section-subtitle{
max-width:760px;

margin:auto;
margin-bottom:55px;

text-align:center;

color:var(--muted);

font-size:18px;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);

gap:28px;
}

.card{
background:
linear-gradient(
180deg,
#ffffff,
#faf7f1
);

padding:36px;

border-radius:30px;

border:1px solid var(--border);

box-shadow:
0 18px 45px rgba(80,70,50,0.07);
}

.card h3{
font-size:24px;

margin-bottom:14px;

color:var(--olive-dark);
}

.card p{
color:var(--muted);
}

/* ABOUT */

.about{
background:
linear-gradient(
135deg,
#ffffff,
var(--cream-dark)
);
}

.about-box{
max-width:1150px;

margin:auto;

display:grid;
grid-template-columns:0.9fr 1.1fr;

gap:60px;

align-items:center;
}

.about-box img{
width:100%;

border-radius:30px;

box-shadow:
0 25px 60px rgba(80,70,50,0.12);
}

.about-text h2{
font-size:44px;

margin-bottom:22px;

color:var(--dark);
}

.about-text p{
margin-bottom:18px;
color:var(--muted);
}

/* PROPERTY */

.property-card{
background:
linear-gradient(
180deg,
#ffffff,
#faf7f1
);

max-width:1100px;

margin:auto;

display:grid;
grid-template-columns:1fr 1fr;

border-radius:34px;

overflow:hidden;

border:1px solid var(--border);

box-shadow:
0 22px 65px rgba(80,70,50,0.1);
}

.property-card img{
width:100%;
height:100%;
object-fit:cover;
}

.property-info{
padding:48px;
}

.property-info h3{
font-size:34px;

margin-bottom:18px;

color:var(--dark);
}

.property-info p{
margin-bottom:28px;

color:var(--muted);
}

/* QUOTE */

.quote{
background:
linear-gradient(
135deg,
var(--olive),
var(--olive-dark)
);

color:white;

text-align:center;

padding:95px 8%;
}

.quote h2{
font-size:40px;

max-width:900px;

margin:auto;

line-height:1.4;
}

/* CONTACT */

.contact{
text-align:center;
}

.contact-box{
background:
linear-gradient(
180deg,
#ffffff,
#f7f2ea
);

max-width:760px;

margin:auto;

padding:55px;

border-radius:34px;

border:1px solid var(--border);

box-shadow:
0 22px 65px rgba(80,70,50,0.1);
}

.contact h2{
font-size:42px;

margin-bottom:16px;

color:var(--dark);
}

.contact p{
color:var(--muted);

margin-bottom:8px;
}

/* FOOTER */

footer{
background:var(--dark);

color:white;

text-align:center;

padding:28px;

font-size:14px;

margin-top:90px;
}

/* MOBILE */

@media(max-width:900px){

header{
flex-direction:column;
gap:16px;
}

nav{
flex-wrap:wrap;
justify-content:center;
gap:16px;
}

.hero,
.about-box,
.property-card,
.grid,
.stats{
grid-template-columns:1fr;
}

.hero h1{
font-size:42px;
}

.hero-image img{
height:360px;
}

.section-title{
font-size:36px;
}

.quote h2{
font-size:30px;
}

}

</style>
</head>

<body>

Kamila <span>Kopřivová</span>
</a>
